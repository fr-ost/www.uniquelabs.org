name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uniquelabs
          POSTGRES_PASSWORD: uniquelabs
          POSTGRES_DB: uniquelabs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniquelabs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://uniquelabs:uniquelabs@localhost:5432/uniquelabs_test?schema=public
      TEST_DATABASE_URL: postgresql://uniquelabs:uniquelabs@localhost:5432/uniquelabs_test?schema=public
      APP_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuv
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build (no database access required)
        run: env -u DATABASE_URL npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uniquelabs
          POSTGRES_PASSWORD: uniquelabs
          POSTGRES_DB: uniquelabs_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniquelabs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://uniquelabs:uniquelabs@localhost:5432/uniquelabs_e2e?schema=public
      APP_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuv
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start the production server
        run: |
          (PORT=3000 npm start &) && npx wait-on http://localhost:3000/api/health --timeout 60000
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
